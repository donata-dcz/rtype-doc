name: Release

on:
  push:
    branches: [main]

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: R-Type v${{ github.run_number }}
          generate_release_notes: true
          body: |
            ## R-Type

            Download the archive for your system, extract it and launch the game.
            No installation or compilation required.

            ### Contents
            - `r-type_client`: the graphical client
            - `r-type_server`: the game server
            - `Assets/`: the game resources

            ### How to run
            1. Download `r-type-linux-x64.tar.gz` (Linux) or `r-type-windows-x64.zip` (Windows)
            2. Extract the archive
            3. Run `r-type_server`, then `r-type_client`

            Run both programs from the extracted folder so the `Assets/` directory is found.
          files: release/*
