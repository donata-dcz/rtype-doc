site_name: R-Type Documentation
site_description: Documentation of the R-Type project
site_url: https://donata-dcz.github.io/rtype-doc/
docs_dir: Docs
exclude_docs: |
  requirements.txt

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to the dark theme
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to the light theme
  features:
    - search.highlight
    - content.code.copy

nav:
  - Introduction: index.md
  - Build and run: build.md
  - Contributing: contributing.md
  - Architecture: architecture.md
  - Client: client.md
  - Protocol: Protocol.md
  - Guides: guides.md
  - Accessibility: Accessibility.md
  - Technical choices: technicalChoices.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
