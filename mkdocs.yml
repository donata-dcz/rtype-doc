site_name: R-Type Documentation
site_description: Documentation of the R-Type project
site_url: https://donata-dcz.github.io/rtype-doc/
docs_dir: Docs
exclude_docs: |
  requirements.txt

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to the dark theme
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to the light theme
  features:
    - search.highlight
    - content.code.copy

nav:
  - Project :
    - Introduction : Project/Introduction
    - Download :
      - R-Type Client : Project/Client.md
      - R-Type Server : Project/Server.md
    - Launch the game : Project/Launch.md
    - Technical choices: Project/TechnicalChoices.md
  - Developer :
    - Introduction: Developer/Introduction.md
    - Build and run: Developer/Build.md
    - Architecture: Developer/Architecture.md
    - Protocol: Developer/Protocol.md
    - Accessibility: Developer/Accessibility.md
    - Guides:
        - Client: Developer/Guides/Client.md
        - Engine: Developer/Guides/Engine.md
        - Server: Developer/Guides/Server.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
