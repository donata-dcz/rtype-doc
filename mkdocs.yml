site_name: R-Type Documentation
site_description: Documentation of the R-Type project
site_url: https://donata-dcz.github.io/rtype-doc/
docs_dir: Docs

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to the dark theme
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to the light theme
  features:
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - About: project/index.md
  - Play: project/play.md
  - Accessibility: project/accessibility.md
  - Build and run: dev/get-started/build-and-run.md
  - Contributing: dev/get-started/contributing.md
  - Architecture: dev/architecture/overview.md
  - Client: dev/architecture/client.md
  - Audio: dev/architecture/audio.md
  - Network protocol: dev/networking/protocol.md
  - Guides:
      - Add a sound: dev/guides/add-a-sound.md
      - Add an image: dev/guides/add-an-asset.md
      - Add a message type: dev/guides/add-a-message-type.md
      - Add a menu option: dev/guides/add-a-menu-option.md
      - Troubleshooting: dev/guides/troubleshooting.md
  - Introduction for developers: dev/index.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

exclude_docs: |
  requirements.txt
